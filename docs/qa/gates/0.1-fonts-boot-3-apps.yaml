  security: PASS
  documentation: PASS

issues:
  - id: REQ-001
    severity: high
    category: requirements
    status: RESOLVED
    resolved_in_iteration: 2
    description: >-
      [RESOLVIDO] Admin não aplicava Hanken Grotesk (font-sans literal "Hanken Grotesk"
      ≠ @font-face gerado "hanken"; --font-hanken definido e nunca usado; body caía para
      system-ui).
    resolution: >-
      Override local de fontFamily.sans em apps/admin/tailwind.config.js apontando para
      ['var(--font-hanken)','system-ui','sans-serif'], sem tocar o preset compartilhado.
      Confirmado no CSS de build: .font-sans → var(--font-hanken) → "hanken", casando com
      @font-face{font-family:hanken}; <html> aplica a classe que define --font-hanken.
      O body deixa de cair para system-ui. typecheck/lint 7/7 forçados, sem regressão.
  - id: REQ-002
    severity: medium
    category: requirements
    status: DEFERRED
    description: >-
      AC2 e a parcela mobile de AC4/AC5 ("abrindo no simulador iOS e emulador Android",
      render fiel, boot paralelo) e a confirmação visual do Admin no browser não puderam
      ser validados empiricamente — sandbox sem simulador/emulador/browser interativo.
      A decisão de o Expo consumir .ttf (não .woff2) via useFonts nunca foi exercitada em
      runtime nativo. Sólido/comprovado em código+CSS, não confirmado em render de device.
    recommendation: >-
      Follow-up OBRIGATÓRIO antes de considerar AC2/AC4-mobile 100% fechados em ambiente
      real: rodar Cliente e Lojista em simulador iOS + emulador Android reais e Admin no
      browser, confirmar (1) app abre sem crash, (2) Hanken Grotesk renderiza (título
      ExtraBold), (3) paleta por app fiel ao protótipo. Não bloqueia o gate (mesmo débito
      deferido aceito no gate 1.3), mas mandatório antes de o Épico 0 reivindicar
      fidelidade visual em device.
  - id: DOC-001
    severity: low
    category: docs
    status: DEFERRED
    description: >-
      A entrada de design-decisions.md (Story 0.1) afirma que .ttf "é mais confiável" em
      runtime nativo (motivo da troca .woff2→.ttf no Expo). Plausível e byte-consistência
      verificada, mas a superioridade .ttf vs .woff2 no Expo SDK 57 não foi comprovada
      empiricamente (nenhum render nativo executado).
    recommendation: >-
      Ao executar o follow-up REQ-002, registrar em design-decisions.md se .woff2 também
      teria funcionado no Expo (fecha o débito .ttf herdado do gate 1.3).
  - id: MNT-001
    severity: low
    category: code
    status: ACCEPTED
    description: >-
      `lint` continua placeholder `echo skipped` nos 3 apps (herdado da Story 1.1) — 7/7
      "passa" mas nenhum ESLint real roda. TypeScript 5.9.3 mantido (vs 6.0.3 recomendado
      pelo Expo) — consistente no monorepo, typecheca ok. Tailwind v3 (vs v4 default do
      create-next-app) — decisão defensável para honrar o preset JS clássico de ui-tokens.
    recommendation: >-
      Nenhuma ação bloqueante. Configurar ESLint real (expo lint / next lint) quando houver
      lógica a proteger, em story futura. Manter TS 5.9.3 e Tailwind v3 no MVP.

regressions_check:
  status: PASS
  evidence: |
    typecheck 7/7 e lint 7/7 em run FORÇADO (--force, 0 cached) — não é replay de cache.
    Preset compartilhado packages/ui-tokens/src/tailwind.js INTACTO: fontFamily.sans segue
    derivando de tokens.typography.fontFamily = "Hanken Grotesk" (verificado). O fix é
    override LOCAL só no Admin — mobile (referência documental do preset) não afetado.
    Fontes .ttf/.woff2 (gates 1.3 e AC1) não tocadas nesta iteração. `next build` do Admin
    compila e gera estático sem erro. Nenhum workspace anterior quebrado.

security_check:
  status: PASS
  evidence: >-
    Story 100% render estático local: sem rede/backend/auth/segredos. Nenhum hex/credencial
    hardcoded de negócio nas Homes. next.config vazio. OWASP básico N/A. O fix (10 linhas de
    config Tailwind) não introduz superfície de ataque.

notes: |
  Re-review (QA Loop iteração 2). Verifiquei o fix de forma INDEPENDENTE, sem confiar no
  relato do @dev:
    - `npx next build` (apps/admin) rodado por mim; inspeção do CSS gerado em
      .next/static confirma a cadeia completa: <html> aplica --font-hanken="hanken";
      .font-sans{font-family:var(--font-hanken),...}; @font-face{font-family:hanken};
      <body class="... font-sans ...">. O Admin renderiza em Hanken Grotesk, não mais
      system-ui. O defeito bloqueante da iteração 1 (REQ-001) está comprovadamente sanado.
    - Sem regressão: turbo typecheck/lint 7/7 em run FORÇADO (0 cache). Preset compartilhado
      intacto ("Hanken Grotesk"); o override é local no Admin — decisão de escopo correta
      (não acopla o preset genérico a um detalhe do next/font/local).

  O que resta é exclusivamente validação VISUAL EMPÍRICA (REQ-002/DOC-001), impossível neste
  sandbox por falta de simulador iOS/emulador Android/browser interativo. Isso é um débito de
  AMBIENTE, não um defeito de código — tratado como deferido, no mesmo padrão já aceito no
  gate 1.3. Por isso o verdict é CONCERNS (aprovar com débito documentado), não FAIL.

  Story pode avançar para Done com o débito REQ-002 registrado como follow-up mandatório
  antes de o Épico 0 reivindicar fidelidade visual em device/browser real.

