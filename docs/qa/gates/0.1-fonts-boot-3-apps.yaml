status_reason: >-
  Re-review (QA Loop iteração 2). REQ-001 (bloqueante) CORRIGIDO e confirmado
  empiricamente no CSS de build: o override local em apps/admin/tailwind.config.js
  faz `.font-sans` resolver para var(--font-hanken) → "hanken", casando com o
  @font-face gerado pelo next/font/local — o Admin deixa de cair para system-ui.
  typecheck/lint 7/7 forçados (0 cache), sem regressão; preset compartilhado intacto
  ("Hanken Grotesk"). Restam apenas REQ-002/DOC-001 (validação visual empírica em
  simulador/emulador/browser), impossível neste sandbox — deferido como débito, mesmo
  padrão do gate 1.3. Aprovado com débito de validação visual documentado.
