iteration_history:
  - iteration: 1
    verdict: FAIL
    at: "2026-07-27"
    reason: >-
      REQ-001 (high, bloqueante): Admin carregava Hanken Grotesk via next/font/local
      mas nunca a aplicava — fontFamily.sans usava o nome literal "Hanken Grotesk"
      (do preset) que não casava com o @font-face gerado "hanken"; --font-hanken
      definido e nunca referenciado; body caía para system-ui. Defeitava AC3/AC4.
  - iteration: 2
    verdict: CONCERNS
    at: "2026-07-27"
    reason: >-
      REQ-001 corrigido (override local de fontFamily.sans → var(--font-hanken) em
      apps/admin/tailwind.config.js) e verificado de forma independente no CSS de
      build. Único débito restante é validação visual empírica (REQ-002/DOC-001),
      bloqueada pelo ambiente — deferida como no gate 1.3. Verdict: CONCERNS.

sandbox_limitations:
  - >-
    Ambiente SEM simulador iOS, emulador Android e browser interativo. A validação
    VISUAL EMPÍRICA real (abertura nos targets nativos, render de fonte no device,
    fidelidade de paleta por captura) NÃO foi possível. AC2 e a parcela mobile de
    AC4/AC5 permanecem verificados apenas por código + boot de processo, NÃO por
    render. O Admin agora tem a cadeia de fonte comprovada no CSS de build, mas o
    render pixel-a-pixel no browser ainda não foi capturado.
  - >-
    CodeRabbit CLI não instalado no sandbox — self-healing pré-review pulado por
    graceful degradation (core-config: skip_if_not_installed). Substituído por
    revisão manual de código + verificações empíricas (next build + inspeção do CSS
    gerado, turbo typecheck/lint forçados).

acceptance_criteria:
  - id: AC1
    description: "Fontes Hanken Grotesk em .woff2 E .ttf para os 5 pesos em packages/ui-tokens/fonts/"
    status: PASS
    evidence: |
      Inalterado nesta iteração (nenhum arquivo de fonte tocado no fix). PASS mantido
      da iteração 1: 5 .ttf byte-consistentes com os .woff2 auditados (fonttools,
      tabelas glyf/cmap/hmtx idênticas; usWeightClass 400/500/600/700/800; name ID 4
      confere; 5 MD5 distintos; .woff2 do gate 1.3 preservados). Conversão de formato,
      não re-download.

  - id: AC2
    description: "apps/cliente e apps/lojista bootados com Expo, useFonts, abrindo no simulador iOS e emulador Android"
    status: CONCERNS
    evidence: |
      Inalterado nesta iteração. Estrutura Expo real e correta em ambos (index.ts +
      App.tsx com useFonts + guard anti-FOUC, app.json, scripts dev, tsconfig
      extends-array, react/react-native pinados ao Expo SDK 57). typecheck clean em run
      forçado. LIMITAÇÃO persiste: "abrindo no simulador iOS e emulador Android" NÃO
      validado empiricamente (sandbox). Débito REQ-002.

  - id: AC3
    description: "apps/admin Next.js App Router, Tailwind consumindo ui-tokens/tailwind.js, @font-face via next/font/local"
    status: PASS
    evidence: |
      RESOLVIDO nesta iteração (era FAIL). Estrutura Next.js 16 App Router correta;
      Tailwind consome o preset (presets: [require('@keepit/ui-tokens/tailwind')]);
      next/font/local registra @font-face família "hanken".
      FIX (apps/admin/tailwind.config.js): theme.extend.fontFamily.sans =
      ['var(--font-hanken)','system-ui','sans-serif'] — override LOCAL, preset
      compartilhado intacto.
      Verificado independentemente no CSS de build de produção (após `npx next build`):
        - .font-sans{font-family:var(--font-hanken), system-ui, sans-serif}
        - <html class="hanken_..._variable"> aplica
          .hanken_..._variable{--font-hanken:"hanken", "hanken Fallback"}
        - @font-face{font-family:hanken} (5 pesos + Fallback)
        - <body class="bg-bg-primary font-sans antialiased">
      Cadeia completa: html(--font-hanken="hanken") → body.font-sans →
      var(--font-hanken) → "hanken" → @font-face hanken. O body NÃO cai mais para
      system-ui. @font-face existe (letra do AC) E surte efeito no render (espírito).

  - id: AC4
    description: "Home mínima com paleta correta (Cliente #F6F7F3, Lojista #1B1E1C, Admin dark), render fiel, sem backend"
    status: CONCERNS
    evidence: |
      Paleta 100% de @keepit/ui-tokens, zero hex hardcoded nas Homes (inalterado).
      Valores conferidos em tokens.json (Cliente #F6F7F3/#75DC8D, Lojista
      #1B1E1C/#75DC8D, Admin dark). MELHORA nesta iteração: a fidelidade de render do
      Admin não está mais quebrada pela fonte — o texto agora resolve para Hanken
      Grotesk (não system-ui), comprovado no CSS de build. RESSALVA restante: validação
      visual empírica de fidelidade (paleta/tipografia por captura em device/browser)
      segue BLOQUEADA no sandbox → débito REQ-002.

  - id: AC5
    description: "pnpm turbo run dev levanta os três apps simultaneamente"
    status: CONCERNS
    evidence: |
      Inalterado. Scripts dev reais e sem colisão (Cliente 8081, Lojista --port 8082,
      Admin next dev). `next build` do Admin prova compilação. Boot paralelo completo
      dos 3 como render segue pendente de ambiente com targets nativos → débito REQ-002.

quality_checks:
  code_review: PASS
  unit_tests: N/A
  acceptance_criteria: CONCERNS
  regressions: PASS
