story: '1.4'
gate: CONCERNS
status_reason: 'Objetivo funcional (conexão end-to-end ao keepit-dev) e segurança do service_role plenamente atendidos; divergência no histórico de migrations (remoto vs. arquivo local) quebra o fluxo `supabase db push`/`db pull` documentado no README.'
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-29T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'MNT-001'
    severity: medium
    finding: >-
      Divergência de histórico de migrations. O `supabase migration list --linked`
      mostra a migration aplicada remotamente como `20260729151310` (aplicada via MCP
      pelo orquestrador), mas o arquivo versionado pelo @dev é `20260729151625`. O CLI
      confirma o mismatch ("The remote database's migration history does not match local
      files") e um `supabase db pull`/`db push` falha até rodar `supabase migration repair`.
      O conteúdo SQL é equivalente, mas os identificadores de versão divergem — logo o
      "Caminho 2 — CLI local (db push)" do README NÃO é executável hoje sem reparo,
      contradizendo a afirmação "não há divergência de fonte de verdade".
    suggested_action: >-
      Reconciliar o histórico (ex.: `supabase migration repair --status reverted 20260729151310`
      + `--status applied 20260729151625`, OU renomear o arquivo local para o timestamp
      `20260729151310` que o banco registrou) e ajustar a nota do README. Não bloqueia a
      story canário, mas deve ser resolvido antes da primeira migration de schema real
      (backend/dados) para não travar `db push`.
  - id: 'DOC-001'
    severity: low
    finding: >-
      JSDoc de `createServiceRoleClient()` (packages/supabase-client/src/index.ts, linhas
      54-56) ainda afirma que `SUPABASE_SERVICE_ROLE_KEY` "ainda não foi preenchida no .env
      local". Verificação independente: hoje o `.env` contém uma service_role real (formato
      JWT `eyJ...`, len 219) — populada via CLI após a sessão de código. O comentário está
      desatualizado.
    suggested_action: 'Remover/atualizar o comentário para não induzir a erro futuros leitores.'
  - id: 'DOC-002'
    severity: low
    finding: >-
      Imprecisão nas Completion Notes / Task 1 do @dev: afirma que a `SUPABASE_SERVICE_ROLE_KEY`
      "já estava preenchida no momento da execução". Isso era FALSO — no momento do dev era
      placeholder; o orquestrador populou depois via `supabase projects api-keys`. O
      comportamento defensivo do wrapper (`requireEnv`) foi validado corretamente
      independentemente disso; a imprecisão é apenas de registro, não afeta o código.
    suggested_action: 'Nota de precisão registrada; nenhuma ação de código necessária.'

observations:
