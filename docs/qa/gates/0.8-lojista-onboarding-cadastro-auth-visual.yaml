sandbox_limitations:
  - >-
    Ambiente SEM simulador iOS / emulador Android / browser interativo. A validação
    VISUAL EMPÍRICA em runtime nativo (render de fonte no device, fidelidade de
    paleta por captura, percorrer o fluxo completo) NÃO foi possível. AC4 fica
    verificado por comparação código × imagens de referência + typecheck, não por
    render pixel-a-pixel — mesmo débito deferido aceito no gate 0.1 (REQ-002).
  - >-
    NÃO é repositório git — impossível diffar autoria por commit. A confirmação de
    que o @dev da 0.8 ficou restrito a `apps/lojista/` baseia-se em: File List
    autoconsistente, imports do lojista apenas de `@keepit/ui-tokens` (nenhum
    core-data adicionado como dep), e ausência de qualquer chamada de rede. Arquivos
    fora de `apps/lojista/` com mtime recente (`apps/cliente`, `packages/*`,
    `apps/admin`) são atribuíveis ao trabalho paralelo da Story 0.4 (outro @dev),
    não a esta story.
  - >-
    CodeRabbit CLI ausente neste ambiente Linux (sem WSL) — self-healing pré-review
    pulado por graceful degradation (core-config: skip_if_not_installed). Substituído
    por revisão manual de código + typecheck + grep de hex + comparação com as
    imagens de referência.

acceptance_criteria:
  - id: AC1
    description: "8 telas (Onboarding, Cadastro 1/2/3, Em análise, Login, Perfil público, Configurações + Excluir conta) substituindo os stubs da 0.3; submit só navega."
    status: PASS
    evidence: |
      Todas as 8 telas do AC1 implementadas com conteúdo real:
      auth/{OnboardingLojista, CadastroPasso1, CadastroPasso2, CadastroPasso3,
      EmAnalise, Login} + perfil/{PerfilPublico, Configuracoes, ExcluirConta}.
      Substituem os stubs `createScreenStub` da 0.3 SEM renomear rotas nem alterar
      `navigation/types.ts` — AuthStack/PerfilStack apenas trocaram os componentes
      e envolveram o navigator com os Providers de rascunho. Nenhum submit persiste:
      "Continuar"/"Enviar cadastro"/"Entendi" só chamam `navigation.navigate`,
      "Entrar" e "excluir" usam `popToTop()`, "Salvar" grava em Context local e
      volta. Nenhuma chamada de rede/fetch/supabase (grep = 0).
  - id: AC2
    description: "Tema dark fiel (#1B1E1C e paleta colors.dark) exclusivamente via @keepit/ui-tokens."
    status: CONCERNS
    evidence: |
      Fundo `darkColors.bg.primary` (#1B1E1C) e paleta consumidos de @keepit/ui-tokens
      em todas as telas; tipografia via `typography` tokens + famílias HankenGrotesk.
      RESSALVA: 3 ocorrências de hex `#1B1E1C` HARDCODED — PrimaryButton.tsx:49,
      Configuracoes.tsx:102 (label do badge Admin) e :167 (letra do avatar). O valor
      coincide com `darkColors.bg.primary`, então não é cor inventada, mas viola a
      regra de ouro "nenhuma cor hardcoded — sempre importar de @keepit/ui-tokens"
      e contradiz a afirmação da Task 11 ("nenhuma cor hardcoded em nenhum arquivo
      novo"). Usado como texto escuro sobre o verde de marca; não existe token
      `text.onAccent`/inverse no design system. Ver MNT-001.
  - id: AC3
    description: "Sem validação de CNPJ real; campos renderizados, submit apenas navega."
    status: PASS
    evidence: |
      CNPJ usa apenas máscara visual `maskCnpj()` (`00.000.000/0001-00`), sem
      validação/BrasilAPI. Categoria/Hub/Chave Pix são dropdowns sem checagem;
      horários são texto livre `HH:mm` (sem picker). Nenhum submit dispara rede —
      todo o estado vive em Contexts em memória (`CadastroDraftContext`,
      `LojaPerfilContext`), perdido ao desmontar o navigator. Respeita a Regra de
      Ouro do Épico 0.
  - id: AC4
    description: "Fidelidade visual verificada contra o protótipo."
    status: CONCERNS
    evidence: |
      Comparadas as 2 telas com frame literal:
      - CadastroPasso1 × lojista-06-cadastro-passo1.png (P6): logo KEEPIT, "Passo 1
        de 3", progress bar de 3 segmentos (1º em accent.brand), título "Cadastre
        seu estabelecimento", subtítulo idêntico, upload de logo (📷 + "Adicionar
        imagem"), Nome da loja, Categoria, CNPJ mascarado, Hub de operação, botão
        "Continuar" verde com texto escuro — FIEL.
      - Configuracoes × lojista-11-configuracoes.png (P11): título, card-resumo
        (avatar inicial verde, "Farmácia Vida", "Farmácia · Hub Centro", "Editar"),
        seção LOJA (Perfil público/Horários/Formas de recebimento), seção EQUIPE
        (Ana Martins/Admin, João Pereira/Equipe), "+ Convidar membro" — FIEL.
      Demais telas (sem frame literal) seguem tokens e os padrões estruturais de
      P6/P11 — sem cores fora do design system (exceto o hex de MNT-001).
      Validação empírica em device deferida (sandbox) — débito REQ-002.

