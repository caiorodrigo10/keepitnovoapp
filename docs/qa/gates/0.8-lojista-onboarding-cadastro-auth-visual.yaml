issues:
  - id: MNT-001
    severity: medium
    category: code
    status: OPEN
    finding: >-
      3 valores hex `#1B1E1C` hardcoded (PrimaryButton.tsx:49, Configuracoes.tsx:102
      e :167) violam a regra de ouro "nenhuma cor hardcoded — sempre importar de
      @keepit/ui-tokens" e contradizem a afirmação da Task 11 ("nenhuma cor
      hardcoded em nenhum arquivo novo"). O valor coincide com darkColors.bg.primary
      (não é cor inventada), usado como texto escuro sobre o verde de marca.
    suggested_action: >-
      Substituir os literais por `darkColors.bg.primary` OU (melhor) introduzir um
      token semântico `text.onAccent`/`text.inverse` em tokens.json e consumi-lo —
      fecha a lacuna de "texto sobre accent" no design system. Não bloqueante para
      o Épico 0, mas deve ser saneado antes de o padrão se replicar em novas telas.
  - id: ARCH-001
    severity: low
    category: architecture
    status: OPEN
    finding: >-
      O cadastro/perfil do lojista usa Contexts locais (CadastroDraftContext,
      LojaPerfilContext) e cópias de CATEGORIA_OPTIONS/HUB_OPTIONS em vez das ports
      mock de packages/core-data. Decisão defensável e correta para o Épico 0 (casca
      visual): AuthPort é cliente-only, StorePort não tem `create`, e adicionar
      core-data + inventar uma "port de cadastro de lojista" anteciparia decisão de
      arquitetura de uma story futura de auth real ("No Invention"). Porém cria um
      débito de fronteira mock/real: o estado de cadastro do lojista vive fora do
      core-data e há valores de fixture duplicados.
    suggested_action: >-
      Follow-up (não bloqueante): ao implementar a auth/onboarding real do lojista,
      reconciliar via um `StorePort.create`/port de onboarding de lojista em
      packages/core-data e consumir CATEGORIA/HUB via HubPort/fixture importada,
      eliminando a duplicação.
  - id: REQ-002
    severity: medium
    category: requirements
    status: DEFERRED
    finding: >-
      AC4 (fidelidade) e a parcela mobile de AC2 não foram validados empiricamente
      em simulador iOS/emulador Android — sandbox sem targets nativos. Verificado
      por código × imagens de referência + typecheck, não por render de device.
    suggested_action: >-
      Follow-up mandatório antes de o Épico 0 reivindicar fidelidade visual em
      device: percorrer Onboarding → Cadastro 1/2/3 → Em análise → Login → Perfil
      público → Configurações → Excluir conta em simulador/emulador, confirmando
      paleta, tipografia Hanken e textos. Mesmo débito deferido aceito no gate 0.1.
  - id: DOC-001
    severity: low
    category: docs
    status: OPEN
    finding: >-
      A Task 11 afirma "nenhuma cor hardcoded em nenhum arquivo novo (todas via
      darkColors.*/tokens)", o que é factualmente incorreto (ver MNT-001).
    suggested_action: >-
      Ao aplicar o fix de MNT-001, a afirmação passa a ser verdadeira — não requer
      ação separada além de sanear os 3 hex.

code_intel_advisory: "N/A (provider indisponível — graceful degradation)"

notes: |
  Revisão independente (sem confiar no relato do @dev):
    - Li as 9 telas + 2 Contexts + 2 shapes de draft + PrimaryButton + navegação
      (AuthStack/PerfilStack/authGuard) e comparei CadastroPasso1/Configuracoes com
      lojista-06/lojista-11 (as 2 únicas referências com frame literal) — fidelidade
      forte em ambas.
    - Rodei `pnpm --filter @keepit/lojista typecheck` → PASS (EXIT 0).
    - Grep de hex hardcoded nos arquivos novos/modificados: 3 ocorrências de
      #1B1E1C (MNT-001). Grep de rede (fetch/axios/supabase/http): 0.
    - Confirmei que apps/lojista/package.json NÃO adiciona @keepit/core-data —
      valida a decisão de Contexts locais (ARCH-001), correta sob "No Invention".

  As 3 decisões do @dev a avaliar:
    1. Contexts locais vs ports mock → DEFENSÁVEL para o Épico 0; registrado como
       débito ARCH-001 (reconciliar em port real de onboarding do lojista no futuro).
    2. Categoria/Hub espelhando fixtures reais, hubPreferencialId comentado como
       não-coluna → CORRETO (sem invenção, honra o "Conflito schema vs. protótipo").
    3. Login/Excluir com popToTop() sem tocar o authGuard estático → CORRETO
       (alterar o guard pertence à story de auth real, fora de escopo).

  Verdict CONCERNS (não FAIL): nenhum problema high/bloqueante; ACs 1 e 3 PASS, ACs
  2 e 4 com ressalvas não-bloqueantes (hex hardcoded saneável + débito visual de
  ambiente). Story pode avançar para Done com MNT-001/ARCH-001/REQ-002 como
  follow-ups.

