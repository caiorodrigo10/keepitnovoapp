top_issues:
  - id: 'REL-004'
    severity: low
    finding: 'O catch de handleCriarConta engole o erro em silêncio (sem console.error, sem estado). Antes da story o erro virava unhandled rejection — ruidoso, mas visível no console. Agora fica invisível até a Story 2.3 implementar o tratamento real. É exatamente o que a AC3 pediu (proibiu console.error e UI nova), portanto não é defeito contra a story.'
    suggested_action: 'Story 2.3: o catch DEVE ganhar tratamento real (mensagem ao usuário) — não deixar o bloco vazio ao integrar o Supabase Auth. Adicionalmente, `error` está bound e não usado; se a 2.3 não for usar o binding, trocar por `catch {`.'
  - id: 'REL-005'
    severity: low
    finding: 'Efeito colateral inerente ao design da AC1 (não um bug de implementação): um usuário de DDD 55 que digitar um 12º dígito por engano vê o número reinterpretado como DDI e o "55" é perdido — backspace não o recupera, pois o dígito já saiu do estado. Ex.: digitando "5511912345678" caractere a caractere, o estado passa de "(55) 11912-3456" para "(11) 9123-4567" no 12º dígito. Verificado pelo @qa; consequência direta da regra "12/13 dígitos + startsWith(55) → strip" aprovada na AC1/@po.'
    suggested_action: 'Nenhuma ação nesta story. Revisitar junto de REL-002 se/quando a validação de DDD real for implementada.'
  - id: 'REL-002'
    severity: low
    status: 'DEBT (fora de escopo por decisão registrada na story)'
    finding: 'isTelefoneBRValido continua aceitando DDD inexistente. Confirmado colateralmente na bateria adversarial: "0055 11 91234-5678" (15 dígitos) → "(00) 55119-1234" com isTelefoneBRValido → true; "+1 555 123 4567" → "(15) 55123-4567" → true.'
    suggested_action: 'Conforme já registrado no gate 2.2 e nas Pendências relacionadas da story 2.2.1.'

