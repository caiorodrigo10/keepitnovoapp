story: '4.3'
gate: CONCERNS
status_reason: 'Leitura real de `produtos` implementada com paridade exata ao mock e barreira RLS (`lojista_gerencia_produtos`, FORCE) verificada na migration; as 6 ACs funcionais estão atendidas. CONCERNS apenas por débitos não-bloqueantes: revisão @architect do novo `getMeuEstabelecimentoId`, regeneração de `shared-types` e validação RLS/E2E em device (mesma lacuna de ambiente das stories anteriores).'
reviewer: 'Quinn'
updated: '2026-08-12T00:00:00Z'

acceptance_criteria:
  AC1:
    status: MET
    method: static
    evidence: '`product.supabase.ts#list` seleciona `PRODUTO_COLUMNS` filtrando `.eq(estabelecimento_id)` — cards de `GerenciarCatalogo.tsx` inalterados; `estoqueDisplay` segue derivado client-side em `ProductCatalogContext.tsx` via `estoqueDisplayFromId(id)`, sem coluna de estoque no schema.'
  AC2:
    status: MET
    method: static+test
    evidence: 'Bug pré-existente corrigido — `ProductCatalogContext.tsx:111` agora passa `{ incluirInativos: true }` ao `list` (antes nunca passado desde a Story 0.9/1.10, tab "Pausados" ficava sempre vazia). Adapter aplica `ativo = true` só quando `incluirInativos` não é true e sempre `.is(excluido_em, null)` — paridade exata com `product.mock.ts#list`. Testes: "com incluirInativos: true, não filtra por ativo".'
  AC3:
    status: MET
    method: static
    evidence: 'Botão "+ Novo" e navegação a `CadastrarProduto` intactos — nenhuma mudança de UI nesta story.'
  AC4:
    status: MET
    method: static
    evidence: 'Menu do card (editar/pausar/excluir) inalterado; efeitos reais permanecem escopados às Stories 4.5/4.6 (`update`/`pause`/`delete` seguem `NotImplementedError`, confirmado em `supabase-adapters.test.ts:49`).'
  AC5:
    status: MET
    method: static+test
    evidence: 'loading/vazio/erro preservados em `ProductCatalogContext.tsx`: erro real propagado ao `setError` (nunca lista vazia disfarçada); `estabelecimentoId === null` resolve para lista vazia honesta (sem sessão/cadastro), não erro. Teste: "lista vazia quando não há produtos — sem erro" e "propaga o erro do SDK sem sucesso fictício".'
  AC6:
    status: MET
    method: static
    evidence: 'RLS `lojista_gerencia_produtos` (FOR ALL, USING via `EXISTS(... dono_user_id = auth.uid())`) + `ENABLE`/`FORCE ROW LEVEL SECURITY` na migration `20260812190000_criar_produtos.sql`. `estabelecimento_id` também aplicado como filtro explícito no adapter (defesa em profundidade), mas a barreira real é o Postgres. Teste simula `permission denied` propagado sem sucesso fictício.'

