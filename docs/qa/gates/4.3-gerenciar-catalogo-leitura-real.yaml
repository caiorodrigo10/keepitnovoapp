    suggested_action: 'Verificado: espelha EXATAMENTE o DDL da migration (12 colunas, tipos, nullability). Regenerar com a tooling quando `SUPABASE_ACCESS_TOKEN` estiver disponível.'
  - id: 'TEST-001'
    severity: low
    finding: 'RLS cross-tenant e leitura em device/E2E validadas apenas por mocks de erro do SDK; teste de integração contra o banco real fica pendente.'
