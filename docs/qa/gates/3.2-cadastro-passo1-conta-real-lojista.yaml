top_issues:
  - id: 'ARCH-001'
    severity: medium
    finding: >-
      A criação da port dedicada LojistaAuthPort (em vez de generalizar AuthPort)
      foi decidida autonomamente pelo @dev; a revisão formal de @architect (Sol)
      da fronteira app → core-data → supabase-client, exigida pela mission ANTES
      da implementação, não ocorreu como sessão distinta.
    suggested_action: >-
      Ratificação retroativa por @architect. A decisão é defensável no mérito
      (reusar AuthPort produziria Cliente fantasma, exatamente o que AC7 evita;
      port mínima só com signUp não antecipa contrato de login 3.10) — QA a
      considera sólida, mas o gate arquitetural continua formalmente aberto.
  - id: 'REL-007'
    severity: medium
    finding: >-
      Divergência de timestamp da migration: arquivo versionado
      20260812032149_desambiguar_signup_lojista.sql vs. aplicação remota no
      keepit-dev sob 20260812032524. Histórico local ≠ remoto quebra
      `supabase db push`/`db pull` (débito transversal já conhecido no projeto).
    suggested_action: >-
      @data-engineer/@devops reconciliarem o histórico de migrations (repair)
      antes da próxima migration (estabelecimentos das Stories 3.4/3.5).
  - id: 'TEST-003'
    severity: low
    finding: >-
      Confirmação end-to-end do no-orphan (AC7) e da chegada do signup ao Auth
      não executada contra keepit-dev; os testes do adapter Supabase usam client
      injetado (caso trivial), não provam o wiring de @keepit/supabase-client.
    suggested_action: >-
      Verificação manual/SQL contra keepit-dev antes do piloto: signup de
      lojista → 0 linhas em clientes; conta presente em auth.users com
      raw_user_meta_data.role='lojista'. Espelha lacuna já aceita em 2.5.1/2.6.
  - id: 'ENV-001'
    severity: low
    finding: >-
      Verificação em device/simulador (fluxo real Passo 1 → conta → avança;
      duplicado → erro sem avançar) e CFG-001 (Confirm email ON no keepit-dev,
      que faz o signUp completar sem sessão) permanecem pendentes — sandbox sem
      simulador e `pnpm qa` só roda tsc nos apps RN.
    suggested_action: >-
      Caio/@dev validam manualmente ao rodar o app Lojista; decidir aplicação
      de CFG-001 (mesmo débito herdado do Cliente).
  - id: 'MNT-001'
    severity: low
    finding: >-
      Migration `estabelecimentos` (schema enxuto do piloto + RLS por ownership)
      não entregue nesta Story — pré-condição das Stories 3.4/3.5, não AC da 3.2.
    suggested_action: >-
      @data-engineer entrega antes/junto da 3.4. Nenhuma AC da 3.2 lê/escreve a
      tabela; não bloqueia esta Story.
  - id: 'OPS-001'
    severity: low
    finding: >-
      O grafo do turbo resolve @keepit/config via `.worktrees/story-2.5.1/`
      (worktree antiga ainda presente no repositório de trabalho).
    suggested_action: >-
      @devops limpar worktrees obsoletas para evitar builds resolvendo caminhos
      de branches encerradas.
  - id: 'DOC-002'
    severity: low
    finding: >-
      O texto do AC4 ("a mensagem não distingue e-mail já existe de outros
      erros") diverge da implementação, que exibe mensagem específica para
      EmailJaExisteError — porém idêntica ao precedente da Story 2.6 do Cliente,
      já aprovado em QA. Anti-enumeração real opera na camada de transporte
      (error.code e obfuscação identities:[] colapsam no mesmo erro).
    suggested_action: >-
      Ajuste editorial do wording do AC4 pelo @po para refletir a decisão de UX
      já vigente; não é defeito de código.

