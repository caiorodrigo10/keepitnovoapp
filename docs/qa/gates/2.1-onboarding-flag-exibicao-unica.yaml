# --- 7 Quality Checks (story-lifecycle.md Phase 4) ---
quality_checks:
  - id: 1
    name: 'Code review (patterns, readability, maintainability)'
    result: PASS
    notes: >-
      `onboardingFlag.ts` é um módulo pequeno, coeso e bem documentado: chave
      namespaced (`@keepit/cliente:onboarding_visto`), 3 funções assíncronas com
      responsabilidade única, comentário [IDS] CREATE justificando por que não
      virou port de `@keepit/core-data` (estado de UI/dispositivo, não dado de
      domínio) — mesmo padrão de `cancelamentoPolicy.ts`. `AuthStack.tsx`
      documenta no próprio arquivo por que o navigator só monta após a leitura
      resolver (`initialRouteName` não é reativo pós-mount em react-navigation),
      o que evita que um futuro leitor "simplifique" e reintroduza o bug.
      Cleanup do `useEffect` com flag `mounted` correto (sem setState após
      unmount). `getOnboardingVisto()` nunca rejeita (try/catch interno), então
      o `.then()` sem `.catch()` não gera unhandled rejection.
  - id: 2
    name: 'Unit tests (coverage, passing)'
    result: CONCERNS
    notes: >-
      Zero testes. `apps/cliente/package.json` tem `"test": "echo skipped"` e
      `"lint": "echo skipped"` — ou seja, o "27/27 verde" do `pnpm qa` significa,
      para esta story, apenas `tsc --noEmit`. `onboardingFlag.ts` é o candidato
      mais fácil possível a teste unitário do repositório inteiro (3 funções
      puras sobre um storage mockável), e a própria story previa que "um teste
      Vitest/Jest simples é bem-vindo mas não é bloqueante". Não foi feito, e
      não havia runner configurado no app — ver TEST-002.
