# --- Notas do revisor ---
review_notes: |
  Story pequena por desenho e recorte correto — o escopo AC4-only é legítimo,
  já que as 3 telas vieram prontas da Story 0.4. O tamanho NÃO foi penalizado.

  O que foi auditado ponto a ponto, conforme solicitado:

  1. **5 pontos de escrita da flag** — todos corretos e completos. Grep de
     `navigate(` nas 3 telas prova que não existe caminho de saída do
     onboarding que deixe de gravar a flag (o bug clássico desta feature NÃO
     está presente). Avanços internos (1→2, 2→3) corretamente não gravam.
  2. **Race condition / rota errada** — não há. O `Stack.Navigator` só é
     montado depois de `initialRoute !== null`, e o cleanup com `mounted`
     impede setState após unmount. O problema remanescente é apenas cosmético
     (UX-001: placeholder dark antes de uma `Login` clara).
  3. **Fail-open** — escolha certa e documentada (OBS-001).
  4. **`__DEV__` guard** — `{__DEV__ ? (...) : null}` é o padrão canônico;
     Metro/Hermes elimina o bloco em release (`__DEV__ === false`). O botão
     não vaza para produção. Ver DEV-001 nas notas de segurança do check 6.
  5. **`authGuard.ts`** — confirmado intacto por `git diff` (vazio) e por
     leitura direta (`AUTH_GUARD_ENABLED = false`). Ausente do File List.
  6. **AsyncStorage vs SecureStore** — decisão alinhada ao "nada além do
     necessário"; `expo-secure-store` seria overkill para um booleano de UX.
  7. **Instalação da dependência** — mérito a registrar: `npx expo install`
     fixou `2.2.0` (compatível com SDK 57), o `pnpm-lock.yaml` foi atualizado
     (+27 linhas) e o pacote está materializado em `node_modules/.pnpm`. O
     débito ARCH-001 do gate 0.4 (symlink manual, lockfile divergente) **não
     se repetiu**.

  **Por que CONCERNS e não PASS:** por um único motivo, e ele é honesto —
  nenhuma linha desta story rodou. O @dev declarou isso explicitamente em vez
  de maquiar, o que é o comportamento certo, e eu não vou validar
  empiricamente o que não foi validado empiricamente. Diferente das Stories
  0.1/0.4, onde o não-testado era estética, aqui o não-testado é o entregável
  inteiro somado à primeira integração de módulo nativo do monorepo. O gate
  CONCERNS existe exatamente para carregar esse débito adiante (TEST-001) sem
  travar a story, cuja implementação está correta em tudo que é auditável sem
  device.

  **Não é dívida que precise ser paga antes de o Épico 2 avançar** — porque
  o `AuthStack` está inalcançável no boot (ARCH-002), o código está dormente
  e não pode quebrar nada hoje. Vira dívida **bloqueante da Story 2.6**, que
  é onde ele acorda.
