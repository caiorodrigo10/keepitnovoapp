top_issues:
  - id: 'TEST-001'
    severity: medium
    category: tests
    finding: >-
      **Nenhuma linha desta story foi jamais executada.** Sem simulador/emulador
      no sandbox e sem teste automatizado, os 3 cenários do AC4 (primeira
      abertura → onboarding; concluir → reabrir → cai em Login; reset em dev →
      reabrir → onboarding volta) foram validados apenas por inspeção de código
      e `tsc --noEmit`. Isto é materialmente diferente do débito REQ-002 das
      Stories 0.1/0.4: lá o não-validado era **fidelidade de pixel** (o código
      rodava, só não se sabia se estava bonito); aqui o não-validado é o
      **entregável inteiro** — persistência, roteamento condicional e o primeiro
      módulo NATIVO do monorepo (`@react-native-async-storage/async-storage`).
      Typecheck prova que os tipos casam; não prova que o módulo nativo linka,
      que a leitura resolve, nem que a rota inicial correta é escolhida em
      runtime. Risco residual real, ainda que baixo (AsyncStorage vem embutido
      no Expo Go e a lógica é trivial).
    suggested_action: >-
      Executar os 3 cenários do AC4 em device/Expo Go na primeira oportunidade
      em que houver ambiente. **Ancorar essa verificação no DoD da Story 2.6**
      (sessão real), que é quando o `AuthStack` volta a ser alcançável no boot —
      ver ARCH-002. Enquanto isso, TEST-002 é a mitigação barata e imediata.
  - id: 'TEST-002'
    severity: low
    category: tests
    finding: >-
      `apps/cliente` não tem runner de teste nem lint reais (`"test": "echo
      skipped"`, `"lint": "echo skipped"`), então o gate oficial `pnpm qa`
      (27/27) não exercita nada além de `tsc` neste app. `onboardingFlag.ts` é
      testável em ~15 linhas com um mock de `AsyncStorage` (get/set/reset +
      caminho de fail-open), o que cobriria boa parte do risco do TEST-001 sem
      precisar de device. Gap de infraestrutura do projeto, não falha da 2.1.
    suggested_action: >-
      Configurar Vitest (ou jest-expo) em `apps/cliente` e começar por
      `onboardingFlag.test.ts`. Habilitar ESLint real no app na mesma passada —
      hoje o "lint" citado em `quality_gate_tools` desta story é nominal.
  - id: 'UX-001'
    severity: low
    category: code
    finding: >-
      O estado transitório do `AuthStack.tsx` (l.45-48) renderiza uma `View`
      com `darkColors.bg.primary`. Isso é coerente quando o destino é
      `Onboarding1` (tema dark, via `OnboardingScreen`), mas **incoerente
      quando a flag é `true`**: o destino é `Login`, que usa `lightColors`.
      Para o usuário recorrente — justamente o caso de uso que esta story
      cria — o caminho é splash → frame escuro → tela clara, com risco de
      flash escuro visível se a leitura do AsyncStorage demorar mais que um
      frame (plausível em cold start de Android). Não há risco de montar o
      navigator com rota errada: o `Stack.Navigator` só é criado depois de
      `initialRoute !== null`, e o guard `mounted` impede setState órfão — essa
      parte está correta.
    suggested_action: >-
      Manter o splash nativo visível até a flag resolver
      (`expo-splash-screen` + `preventAutoHideAsync`/`hideAsync`), ou, como
      correção mínima, pintar o placeholder com a cor do destino
      (`visto ? lightColors.bg.primary : darkColors.bg.primary`) — o que exige
      guardar o valor lido antes de decidir a rota. Não bloqueante; só será
      observável quando ARCH-002 for resolvido.
  - id: 'ARCH-002'
    severity: low
    category: requirements
    finding: >-
      Com `AUTH_GUARD_ENABLED = false`, `RootNavigator` monta `MainTabs` e o
      `AuthStack` **nunca é montado no boot** — ou seja, todo o comportamento
      entregue por esta story fica dormente no build atual. Isso é correto e
      esperado (é a pré-condição AC4f, herdada da Story 0.3), mas amplifica o
      TEST-001: o código só será exercitado de verdade semanas depois, na
      Story 2.6, quando a sessão real for introduzida — longe do contexto de
      quem o escreveu.
    suggested_action: >-
      Registrar explicitamente na Story 2.6 que, ao ligar a sessão real, os 3
      cenários do AC4 da 2.1 devem ser verificados empiricamente como parte do
      seu DoD. Não reabrir a 2.1 por isso.
  - id: 'OBS-001'
    severity: low
    category: code
    finding: >-
      Escolha de fail-open **auditada e aprovada**: `getOnboardingVisto()`
      retorna `false` em qualquer erro de leitura, e as escritas engolem erro
      silenciosamente. Está correto — o pior caso é o onboarding reaparecer
      (irritação mínima, ~15s), enquanto o fail-closed (assumir "visto" e ir
      para `Login`) esconderia a explicação do produto de um usuário novo, que
      é pior, e travar o boot seria inaceitável. A escolha está documentada nos
      docstrings do helper. Duas ressalvas menores, não acionáveis agora:
      (a) os `catch` são completamente silenciosos, sem nem um `console.warn`
      sob `__DEV__`, o que dificultará diagnosticar um storage quebrado;
      (b) as escritas são fire-and-forget (`void`) imediatamente seguidas de
      `navigation.navigate()` — se o app for morto nos milissegundos seguintes,
      a flag se perde. Ambas degradam para "onboarding reaparece", coerente com
      a política declarada.
    suggested_action: >-
      Opcional: adicionar `if (__DEV__) console.warn(...)` nos 3 `catch`.
      Nenhuma ação obrigatória.
  - id: 'DOC-002'
    severity: low
    category: docs
    finding: >-
      **Débito conhecido, fora do escopo desta story — não é falha da
      implementação.** AC1/AC2/AC3 do épico (pager "Passo 1 de 3", copy literal
      dos 3 cards, rótulo "Continuar") estavam errados/sem fonte no protótipo e
      foram corrigidos pelo @pm em 2026-07-30 em
      `docs/prd/epics/2-auth-cliente.md`. As telas 1/3 e 2/3 são reconstrução
      assistida (o protótipo só tem a captura da tela final,
      `cliente-01-onboarding.png`), e a palavra "PIN" não aparece em nenhuma
      das 3 telas. A pergunta de produto associada está aberta e rastreada como
      **10.7 🟡** em `docs/PERGUNTAS_REGRAS_NEGOCIO.md` ("O PIN de retirada
      precisa ser explicado ao cliente antes do cadastro?").
    suggested_action: >-
      Nenhuma ação nesta story. Acompanhar a resposta de 10.7 (Caio/
      stakeholder) e abrir story de ajuste de copy do onboarding se a decisão
      exigir mencionar o PIN antes do cadastro.

