    name: 'Acceptance criteria met'
    result: PASS
    notes: >-
      AC4a: flag ausente → `getOnboardingVisto()` retorna `false` →
      `initialRouteName='Onboarding1'`. AC4b: **auditados os 4 pontos de saída**
      do onboarding e todos gravam a flag — Onboarding1 "Pular" (l.40),
      Onboarding2 "Pular" (l.36), Onboarding3 "Criar conta" (l.34) e "Já tenho
      conta · Entrar" (l.41). Grep de `navigate(` nas 3 telas confirma que as
      ÚNICAS outras navegações são `Onboarding1→2` e `2→3` (avanço interno, que
      corretamente NÃO deve gravar). **Não existe caminho de saída do onboarding
      sem gravação da flag.** AC4c: flag `true` → `initialRouteName='Login'`
