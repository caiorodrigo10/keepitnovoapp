status_reason: 'Story config-only (dois `app.json`) — as 6 ACs verificadas empiricamente contra os arquivos reais: `android.package` exatos e confirmados por Caio (2026-08-09), `versionCode: 1`, `permissions: []` justificado por grep vazio de deps de permissão, `scheme` do Lojista adicionado, nenhum campo Android obrigatório ausente no expo-doctor, e nenhuma fixture mock atribuível a esta story. As 2 falhas de expo-doctor (react duplicado no monorepo / drift de versão vs. Expo SDK 57) são pré-existentes de ambiente e não mencionam campo Android obrigatório — não rebaixam o gate.'
reviewer: 'Quinn'
