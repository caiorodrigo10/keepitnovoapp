storyName: "Admin: Aprovações & Hubs"
gate: CONCERNS
verdict: CONCERNS
status_reason: >-
  Implementação sólida e verificada de forma independente: as 6 telas do Admin
  (login, aprovações, aprovar/rejeitar, hubs list/novo/editar) renderam de fato
  (HTTP 200 em todas + screenshot Playwright de /aprovacoes com dados reais do
  mock "Padoca Nova / EM ANÁLISE / ALIMENTACAO" via admin.port.pendingStores()),
  todos os 3 ACs atendidos, zero cor/hex hardcoded (grep limpo, só tokens
  @keepit/ui-tokens dark), motivo de rejeição obrigatório (botão desabilitado +
  validação inline), CRUD de hub com soft-deactivate correto, e `pnpm --filter
  @keepit/admin typecheck` PASS (exit 0). CONCERNS apenas por débitos
  não-bloqueantes: symlink manual de @keepit/core-data não é reproduzível em
  checkout limpo (exige `pnpm install` do @devops antes do push), campos de
  schema deferidos (cnpj/telefone/chave_pix) e ausência de testes automatizados
  (herdado do padrão do Épico 0). Nenhum AC ficou em aberto.
reviewer: Quinn
reviewedBy: "@qa (Quinn)"
reviewedAt: "2026-07-28"
updated: "2026-07-28T02:11:00Z"
model: opus (claude-opus-4-8)

verification_method: >-
  Verificação INDEPENDENTE (não confiando no relato do @dev): leitura de todos os
  6 page.tsx + 4 componentes (Badge/Card/Button/HubForm) + 2 hooks + adminClient
  + authGuard; grep por hex/rgb/style inline em app/(dashboard), app/(auth) e src
  (limpo); cruzamento das chamadas de port contra as assinaturas reais em
  packages/core-data/src/ports/{admin,hub,store}.port.ts; verificação de que cada
  classe de token usada resolve em packages/ui-tokens (colors.dark, radii,
  letterSpacing, shadows.card); execução própria de `npx tsc --noEmit` no
  workspace admin (exit 0); boot de `next dev` limpo (rm -rf .next) + `curl` nas 6
  rotas (todas 200, zero PageStub) incluindo ids reais (estab-em-analise,
  hub-centro) e estados ?vazio=1/?erro=1; screenshot Playwright de /aprovacoes
  confirmando tema dark + sidebar + dados reais do mock.

