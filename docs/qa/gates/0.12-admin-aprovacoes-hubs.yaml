  documentation:
    status: PASS
    notes: "Dev Notes/Completion Notes completos; Change Log mantido; comentários com Source."

top_issues:
  - id: MNT-001
    severity: medium
    finding: >-
      Dependência @keepit/core-data foi adicionada a apps/admin/package.json
      (workspace:*) mas o vínculo em node_modules foi criado como symlink MANUAL
      (constraint da missão: sem `pnpm install`). Em checkout limpo/CI o build
      quebra até rodar `pnpm install`, pois o symlink não é versionado.
    suggested_action: >-
      @devops deve rodar `pnpm install` (atualizando pnpm-lock.yaml) e confirmar
      que o admin resolve @keepit/core-data sem o symlink manual, ANTES do push.
  - id: TEST-001
    severity: low
    finding: >-
      Sem testes automatizados das 4 telas/fluxos (aprovar/rejeitar, CRUD hub,
      validação de motivo). Consistente com o padrão do Épico 0 (casca visual).
    suggested_action: >-
      Rastrear como débito; adicionar cobertura quando a lógica real (Épico 1)
      substituir os mocks.
  - id: REQ-001
    severity: low
    finding: >-
      Estabelecimento na port real não tem cnpj/telefone/chave_pix/aprovado_em;
      corretamente NÃO inventados (Article IV), mas a aprovação real (Épico 1)
      dependerá desses campos (CNPJ/PIX/telefone do lojista).
    suggested_action: >-
      @po/@architect avaliarem reabrir 0.2/1.x para adicionar esses campos ao
      schema/port antes do Épico 1.
  - id: MNT-002
    severity: low
    finding: >-
      Botão de hub rotulado "Excluir"/"Excluindo…" executa soft-deactivate
      (update ativo:false), não delete físico. Decisão funcional correta (evita
      quebra de integridade com pedidos.hub_id), mas o rótulo diverge da ação.
    suggested_action: >-
      Considerar renomear para "Desativar" para alinhar rótulo e comportamento.
  - id: MNT-003
    severity: low
    finding: >-
      typecheck/lint cross-workspace (turbo) não executados (deliberado, para não
      colidir com @dev irmão em packages/*). Só o workspace admin foi validado.
    suggested_action: >-
      @devops rodar `pnpm turbo run typecheck` e `lint` completos antes do push.

