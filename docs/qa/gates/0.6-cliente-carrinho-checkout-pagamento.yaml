status_reason: >-
  As 6 telas + modal CPF existem, navegáveis, typecheck verde, zero hex/valor
  financeiro hardcoded (taxa lida de @keepit/config), nenhuma cobrança real
  (order.port.create mock, cartão só ultimo4/bandeira/nome) e rotas preservadas
  sem rename — mas ficam 6 débitos não-bloqueantes: taxa de serviço 🔴 pendente
