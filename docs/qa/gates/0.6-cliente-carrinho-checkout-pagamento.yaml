      pagamento) evitam duplicação nas 6 telas. format.ts centraliza
      formatReais (antes duplicado por tela na 0.4/0.5). CartContext isola o
      estado local de carrinho/hub/pagamento/CPF/cartões com useCallback/useMemo
      corretos. Comentários [IDS]/[AUTO-DECISION]/[TECH DEBT] documentam cada
      decisão. Narrowing de payment.type tratado (bug TS2339 corrigido pelo @dev
      capturando `const payment = cart.payment`).
  - id: 2
    name: 'Unit tests (coverage, passing)'
    result: N/A
    notes: >-
      Sem testes de UI automatizados — mesma decisão consciente das Stories
      0.1–0.5 (casca visual, MVP). O cálculo de taxa/total é composição trivial
      (subtotal * percent + subtotal) sobre dados já validados: @keepit/config
