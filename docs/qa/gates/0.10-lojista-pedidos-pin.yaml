    status: PASS
    notes: 'As 10 telas presentes; rotas preservadas; DigitarPin tela cheia (não modal); botão Confirmar entrega presente e fiel ao P3.'
  - ac: 'AC2 — máquina de estados via mock refletida na UI, com guards de transição inválida'
    status: PASS
    notes: >-
      Transições refletem no card imediatamente (upsert no OrdersContext); guards tipados
      (OrderTransitionError) rejeitam transições inválidas sem mudar estado. Sólido por inspeção,
      mas sem cobertura de teste automatizada (TEST-001).
  - ac: 'AC3 — fidelidade visual (tema dark) contra o protótipo'
    status: CONCERNS
    notes: >-
      Alta fidelidade contra os 3 frames (P2/P3/P8) — header, tabs pill, cards, badges, checkboxes,
      caixas de PIN, teclado e botões conferem. 2 literais #1B1E1C novos violam a cláusula "nenhum
      hex hardcoded" (MNT-001, valor correto, sem defeito visual).

