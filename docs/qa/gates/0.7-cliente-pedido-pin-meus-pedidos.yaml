top_issues:
  - id: ARCH-001
    severity: medium
    finding: 'order.port não cobre os estados em_preparo/saindo_hub/no_hub/cliente_chegou_em (dependem do app Lojista, 0.9/0.10) nem getById; supridos por OrderStatusOverrideContext + usePedidoDetail client-side (tech debt).'
    suggested_action: 'Consolidar no ARCH de core-data: estender OrderPort (advanceStatus/markChegada/getById) e substituir o override local por chamadas reais à port. Coordenar com 0.9/0.10/0.12/0.13.'
  - id: REQ-001
    severity: medium
    finding: 'Percentuais de reembolso (100/90/10/80/20 — Rodada 2) NÃO estão em @keepit/config; centralizados em apps/cliente/src/lib/cancelamentoPolicy.ts. Story/CodeRabbit focus exige valores de regra vindos de packages/config.'
    suggested_action: 'Follow-up: estender @keepit/config (businessConfig) com os percentuais de reembolso decididos na Rodada 2 e migrar cancelamentoPolicy.ts para consumir de lá. É valor de regra de negócio que deve morar no config central. Mitigado por ora: centralizado em 1 arquivo com fonte citada, packages/* fora do escopo desta mission.'
  - id: REQ-002
    severity: low
    finding: 'Fidelidade visual não validada em device (sem simulador/emulador) — pequenos gaps identificados por leitura: botão "Ajuda" ausente no Recibo, chip "PIX" ausente, nome da loja ausente no footer de "Seu pedido", tabs vs seção combinada em MeusPedidos.'
    suggested_action: 'Deferir para @ux-expert + validação em device quando disponível. Ajustar Recibo (adicionar "Ajuda" + chip PIX) e footer de ModalConfirmarPin (incluir nome da loja) na passada de fidelidade.'
  - id: TEST-001
    severity: low
    finding: 'apps/cliente sem framework de teste configurado (test = echo skipped, precedente desde 0.1); nenhum teste unitário novo. Lógica pura (pedidoStatus.ts, cancelamentoPolicy.ts) escrita como funções puras exportadas, prontas para teste.'
    suggested_action: 'Configurar runner de teste em apps/cliente numa story de tooling futura e cobrir pedidoStatus/cancelamentoPolicy. Não bloqueia (mesmo precedente 0.4-0.6).'

