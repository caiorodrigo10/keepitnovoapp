acceptance_criteria_review:
  - id: AC1
    description: 'Telas implementadas com fidelidade (PIN, Cheguei ao hub, Recibo, Meus pedidos, exceções) substituindo stubs da 0.3'
    status: PASS
    notes: 'Todas as 6 telas implementadas substituindo os stubs da 0.3; rotas preservadas em PedidosStack.tsx + RootNavigator.tsx (ModalConfirmarPin), params pedidoId adicionados sem quebrar navegação existente. ModalConfirmarPin reaproveita a rota já mapeada pela 0.3 (decisão correta).'
  - id: AC2
    description: 'Máquina de estados do pedido mockada em memória via order.port'
    status: CONCERNS
    notes: 'Fronteira crítica CONFIRMADA: o Cliente apenas EXIBE o PIN (caixas de dígitos read-only, sem TextInput) — nunca digita. Transições reais (accept/confirmPin/cancel) usam a port de verdade. Porém order.port NÃO expõe em_preparo/saindo_hub/no_hub/cliente_chegou_em → o @dev criou OrderStatusOverrideContext client-side (tech debt bem documentado, sem persistência/rede). OrderStatusDevAdvancer só oferece o próximo passo válido — nenhuma transição pula estado.'
  - id: AC3
    description: 'Estados loading/vazio/erro fiéis via injeção de latência/erro do mock'
    status: PASS
    notes: 'MeusPedidos usa DevStateToggle (__DEV__) + toAsyncCallOptions → forceEmpty/forceError/delayMs em usePedidosMine, mesmo padrão das 0.4-0.6. Telas de detalhe herdam loading/erro/vazio via usePedidoDetail (AsyncStateBlock em todas). Empty labels específicos por tela.'
  - id: AC4
    description: 'Fidelidade visual verificada contra o protótipo (tema claro)'
    status: CONCERNS
    notes: 'Comparação feita contra as 3 referências. Alta fidelidade em estrutura, tipografia e cores (100% via @keepit/ui-tokens, zero hex hardcoded). Pequenos gaps: (1) Recibo não renderiza o botão "Ajuda" presente em cliente-14; (2) faixa de pagamento sem o chip "PIX" da referência; (3) footer de "Seu pedido" omite o nome da loja ("Pedido #2048 · Farmácia Vida · R$"); (4) MeusPedidos usa tabs exclusivas enquanto cliente-07 sugere seção "CONCLUÍDOS" abaixo dos ativos. Validação em device deferida (REQ-002, sem simulador).'

