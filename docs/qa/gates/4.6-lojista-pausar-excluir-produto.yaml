      refs: ['packages/core-data/src/supabase/product.supabase.ts']
    - action: 'Alinhar honestidade de `delete` cross-tenant a `update`/`pause` (verificar linhas afetadas).'
      refs: ['packages/core-data/src/supabase/product.supabase.ts']

