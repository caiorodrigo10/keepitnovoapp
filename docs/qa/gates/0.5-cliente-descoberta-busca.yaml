# --- 7 Quality Checks (story-lifecycle.md Phase 4) ---
quality_checks:
  - id: 1
    name: 'Code review (patterns, readability, maintainability)'
    result: PASS
    notes: >-
      Componentes de discovery reutilizáveis (StoreCard/ProductRow/SearchBar/
      CategoryChips/AsyncStateBlock/RatingLabel/LojaEstadoBadge/ImagePlaceholder)
      evitam duplicação nas 6 telas. Hooks locais compõem `useAsyncResource` +
      `getDataClient()` no mesmo padrão de useCurrentCliente (0.4)/useAdminHubs
      (0.12). Comentários [IDS]/[AUTO-DECISION] documentam cada decisão. Imports
      limpos, params de rota tipados.
  - id: 2
    name: 'Unit tests (coverage, passing)'
    result: N/A
    notes: >-
      Sem testes de UI automatizados — mesma decisão consciente das Stories
      0.1/0.3/0.4 (casca visual, MVP). Contrato das ports (incl. deriveLojaEstado
      → aberta/fechada/pausada) já é testado em packages/core-data (Story 0.2,
      ex.: store.mock.test.ts); esta story apenas consome o contrato mockado.
  - id: 3
    name: 'Acceptance criteria met'
    result: PASS
    notes: >-
      AC1: 6 telas (Home, Hub, Loja+catálogo, DetalheProduto, BuscaProduto,
      BuscaLoja) implementadas em apps/cliente/src/screens/home/, substituindo
      stubs da 0.3 sem rename de rota (navigation/types.ts só adicionou params
      tipados). Loja renderiza os 3 estados (aberta/fechada/pausada) via
      store.getState + LojaEstado; rating placeholder via RatingLabel. AC2:
      dados exclusivamente via hooks compondo getDataClient() + ports
      (hub/store/product) — grep confirmou zero import de mock/fixtures nas
      telas. AC3: DevStateToggle (__DEV__) injeta forceEmpty/forceError; cada
