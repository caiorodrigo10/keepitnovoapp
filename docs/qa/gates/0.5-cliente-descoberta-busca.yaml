      zero hex hardcoded; catálogo desabilitado com opacity 0.4 + pointerEvents
      none quando fechada/pausada.
  - id: 4
    name: 'No regressions'
    result: PASS
    notes: >-
      `pnpm --filter @keepit/cliente typecheck` → exit 0 (rodado nesta revisão).
      File List restrito a apps/cliente/**. `lint`/`test` são `echo skipped`
