      Nenhum cálculo real de distância (Haversine proibido no Épico 0).
  - id: 7
    name: 'Documentation'
    result: PASS
    notes: >-
      Dev Agent Record exaustivo (cobertura por AC, [AUTO-DECISION]s, como os 3
