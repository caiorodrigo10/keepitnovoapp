notes:
  - id: 'NIT-001'
    severity: low
    finding: '`expo-splash-screen` foi adicionado com range caret (`^57.0.5`), enquanto os demais pacotes `expo-*` da SDK (`expo-font ~57.0.1`, `expo-status-bar ~57.0.1`) usam til (`~`). Convenção Expo prefere `~` para pacotes de SDK. Funcionalmente inofensivo: o `pnpm-lock.yaml` pina 57.0.5 e resolve contra `expo@57.0.8`.'
    suggested_action: 'Opcional — alinhar para `~57.0.5` numa passada futura de housekeeping de dependências. Não bloqueia.'
  - id: 'DOC-001'
    severity: low
    finding: '`expo-doctor` não re-executado no sandbox (sem simulador/rede — mesma limitação de ambiente documentada desde a Story 0.1). @dev reportou 18/20 nos dois apps; as 2 falhas remanescentes (react duplicado do monorepo / drift de versão SDK) são pré-existentes e nenhuma menciona `expo-splash-screen`, confirmando reconhecimento do plugin.'
    suggested_action: 'Aceitável. AC2 verificável estaticamente por conteúdo de `app.json`/`package.json`/lockfile — todos confirmados diretamente. Nenhuma ação requerida.'
  - id: 'DOC-002'
    severity: low
    finding: 'CodeRabbit CLI indisponível no sandbox (auth não-interativa) — self-healing pulado com degradação graciosa.'
    suggested_action: 'Aceitável: mudança config JSON pura + declaração de dependência, sem lógica de aplicação. Nenhuma ação requerida.'
