top_issues:
  - id: 'REQ-002'
    severity: low
    category: requirements
    finding: >-
      Fidelidade visual (AC2) não validada em simulador iOS/emulador Android —
      sandbox sem ambiente visual. Débito herdado dos gates 0.1/0.3.
    suggested_action: >-
      Rodar as 9 telas em device/simulador real e comparar 1:1 com as 4
      referências antes de fechar o Épico 0.
  - id: 'REQ-003'
    severity: medium
    category: requirements
    finding: >-
      Gap de schema email/senha: FR1 (cadastro com nome+email+senha+telefone) e
      FR3 (login email+senha) são coletados pela UI, mas o tipo `Cliente` (Story
      0.2, já Done) não modela email/senha — a port `auth.signUp` só aceita
      {nome, telefone}. Hoje inócuo (sem submit real), mas bloqueia auth real no
      Épico 1.
    suggested_action: >-
      Escalar ao stakeholder (via Caio) ANTES do Épico 1: o modelo de auth do
      MVP é telefone+SMS (docstring de auth.port.ts) ou email+senha (FR1/FR3)?
      Reconciliar `Cliente`/`AuthPort` em core-data conforme a decisão. Registrar
      em docs/PERGUNTAS_REGRAS_NEGOCIO.md.
  - id: 'ARCH-001'
    severity: low
    category: code
    finding: >-
      Dep `@keepit/core-data` adicionada a apps/cliente/package.json + symlink
      manual em node_modules, sem `pnpm install` e sem atualizar pnpm-lock.yaml
      (proibido no sandbox). Aceitável para casca/typecheck, mas o lockfile diverge
      do estado real.
    suggested_action: >-
      @devops/CI deve rodar `pnpm install` de reconciliação para regenerar o
      lockfile e materializar a dep antes de qualquer build/deploy real.
  - id: 'REQ-004'
    severity: medium
    category: requirements
    finding: >-
      Divergência de tema no Onboarding: o protótipo (cliente-01-onboarding.png)
      é ESCURO (fundo escuro, círculo verde com ícone de casa, chips de categoria),
      mas a implementação usa tema CLARO (#F6F7F3) — o @dev seguiu a instrução
      explícita da story ("tema claro" em AC2/Dev Notes). AC2 exige fidelidade ao
      protótipo, criando conflito entre a instrução escrita e a referência visual.
    suggested_action: >-
      @po/stakeholder decidir: o onboarding do Cliente deve ser escuro (fiel ao
      protótipo) ou claro (consistente com o restante do app)? Ajustar a story ou
      a tela conforme a decisão.
  - id: 'DOC-001'
    severity: low
    category: docs
    finding: >-
      Login social (Google/Apple) presente no protótipo foi removido — correto
      per decisão Rodada 2 (fora do MVP). Onboarding 1/2, Confirmação SMS,
      Esqueci a senha e Configurações não têm captura dedicada; layout inferido do
      design system. Perfil mostra telefone (não email) e itens de menu
      parcialmente conectados.
    suggested_action: >-
      Nenhuma ação de código — desvios já documentados no Dev Agent Record.
      Validar as inferências contra o board completo quando houver device.

waiver: { active: false }

# --- Notas do revisor ---
review_notes: |
  Gate CONCERNS (não PASS) apenas para RASTREAR os 4 débitos não-bloqueantes
  acima — nenhum deles impede o objetivo desta story (casca visual do fluxo de
  entrada do Cliente para revisão de UX). AC1-AC4 atendidos a nível de código;
  typecheck verde; zero hex/regra hardcoded; navegação sem auth real confirmada.

  Follow-ups mais importantes para o @po/stakeholder:
    1. REQ-003 (gap email/senha) — decisão de modelo de auth do MVP, bloqueia Épico 1.
    2. REQ-004 (tema do onboarding) — decisão de fidelidade visual.
    3. ARCH-001 (pnpm install de reconciliação) — @devops/CI.
    4. REQ-002 (validação em device) — débito herdado, mesmo padrão 0.1/0.3.
