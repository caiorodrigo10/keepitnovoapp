status_reason: 'Todas as ACs atendidas — validações client-side corretas (limites inclusivos, coerência geo "ambas ou nenhuma"), sem persistência (AC4) e sem regressão no Passo 1. Débito não-bloqueante: `endereco` sem validação de obrigatoriedade e verificação device/visual manual pendente.'
