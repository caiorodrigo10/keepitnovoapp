top_issues:
  - id: 'REL-001'
    severity: medium
    finding: 'maskTelefoneBR corrompe silenciosamente entradas com DDI: "+55 11 91234-5678" vira "(55) 11912-3456", que passa em isTelefoneBRValido. Colar um número com +55 grava um telefone errado sem nenhum aviso.'
    suggested_action: 'Descartar prefixo 55 quando os dígitos extraídos tiverem 12-13 posições (ou rejeitar explicitamente). Adicionar teste.'
  - id: 'TEST-003'
    severity: low
    finding: 'Os 15 testes cobrem os casos declarados e não são complacentes, mas não cobrem: entrada com DDI, DDD fora da faixa BR, "(11)91234-5678" sem espaço, e round-trip mask→valido.'
    suggested_action: 'Acrescentar esses 4 casos quando REL-001/REL-002 forem endereçados.'
  - id: 'REL-002'
    severity: low
    finding: 'isTelefoneBRValido aceita DDDs inexistentes ((00), (01), (10)) e celulares de 9 dígitos que não começam com 9 ((11) 81234-5678). A AC4 pede apenas validação de formato, então não bloqueia.'
    suggested_action: 'Restringir a /^\(\d{2}\) (\d{4}|9\d{4})-\d{4}$/ com DDD >= 11, se/quando o telefone virar dado operacional.'
  - id: 'DOC-004'
    severity: low
    finding: 'JSDoc pré-existente (linha 35-37 de CriarConta.tsx, Épico 0) afirma que login social saiu "por decisão de negócio da Rodada 2", mas a pendência 10.2 continua ABERTA → STAKEHOLDER. Contradição documental. A AC1 NÃO é invalidada: o JSX não renderiza Google/Apple.'
    suggested_action: 'Corrigir o comentário para citar 10.2 como pendência aberta. @dev acertou em não tocar (fora do File List desta story).'
  - id: 'REL-003'
    severity: medium
    finding: 'handleCriarConta usa try/finally sem catch; com o mock nada rejeita, mas na Story 2.3 (Supabase real) qualquer erro vira unhandled rejection. Além disso, se a 2.3 puser navigate no finally, navegará também em caso de erro.'
    suggested_action: 'Story 2.3: adicionar catch (já necessário para e-mail duplicado, AC dela) e colocar a navegação de sucesso no try, não no finally.'
