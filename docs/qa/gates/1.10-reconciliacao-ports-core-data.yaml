issues:
  - id: DOC-001
    severity: low
    category: docs
    status: DEFERRED
    description: >-
      CodeRabbit CLI indisponível neste ambiente (sandbox Linux sem WSL/CLI) — self-healing
      pré-review pulado por graceful degradation, mesmo padrão dos gates 0.1/0.2. Substituído
      por revisão manual + execução própria de typecheck/lint/test. Para uma story de fundação
      que destrava o Supabase (Story 1.6) e 11 telas, o scan automatizado é desejável antes do push.
    recommendation: >-
      @devops rodar `coderabbit --prompt-only -t committed --base main` antes do push.
  - id: PERF-001
    severity: low
    category: code
    status: OPEN
    description: >-
      financeiroPresentation.ts expõe variacaoPercent/retiradasOkPercent como valores estáticos/
      neutros — não modelados por nenhuma port (analytics.port não os cobre). São campos puramente
      ilustrativos das telas de Financeiro; a decisão foi mantê-los neutros em vez de inventar
      dado. Aceitável, mas a tela mostra um número que não deriva de dado real.
    recommendation: >-
      Se essas métricas virarem requisito de produto, estender analytics.port (variação período-a-
      período; % de retiradas OK) em story futura, em vez de valor estático de apresentação.
  - id: MNT-001
    severity: low
    category: code
    status: OPEN
    description: >-
      db.reembolsos passou a nascer SEEDADO (3 fixtures promovidas de adminOpsFixtures.ts) em vez
      de vazio, para a tela "Fila de reembolsos" do Admin ter conteúdo de demo. É uma escolha de
      dado de demo (documentada em db.ts); o teste admin.mock foi ajustado p/ refletir a fila não-
      vazia. Legítimo para demo, mas mistura seed de demo com dados gerados organicamente pelas
      transições — em teste, é preciso distinguir os 3 seeds dos reembolsos criados no fluxo.
    recommendation: >-
      Aceitável no MVP. Ao plugar Supabase (Story 1.6), garantir que o seed de demo não vá para
      produção (fica só na fixture mock).
  - id: MNT-002
    severity: low
    category: code
    status: OPEN
    description: >-
      4 comentários [TECH DEBT] permanecem em apps/*: CartContext (cartão mock inicial efêmero),
      LojistaNaoVeio (order.cancel só grava status genérico, sem nao_entregue_lojista nomeado),
      FinanceiroContext (WalletPort sem agregação mensal), FormasRecebimento (WalletPort sem chave
      PIX). Todos são gaps FORA do mapeamento desta story e honestamente documentados no Completion
      Notes. O do cartão mock (clientes_cartoes) é adjacente ao domínio avaliado no AC8 (mantido local).
    recommendation: >-
      Registrar os 4 como gaps de reconciliação futura no backlog (Épico 0 residual). O de
      LojistaNaoVeio (motivo nao_entregue_lojista nomeado) e o de PIX/agregação de WalletPort são
      candidatos naturais a uma próxima story de extensão de ports.
  - id: REL-001
    severity: low
    category: code
    status: OPEN
    description: >-
      registrarReembolso#percentClientePorMotivo resolve 2 motivos SEM percentual fechado na matriz
      por defaults inline: cancelamento_atraso→lojistaNaoVeioPercent(100%) e chargeback→0%. São
      inferências razoáveis e documentadas inline, mas não confirmadas pelo stakeholder.
    recommendation: >-
      Registrar em docs/PERGUNTAS_REGRAS_NEGOCIO.md a % de reembolso para cancelamento_atraso e
      chargeback como pendência do stakeholder; hoje os defaults são do @dev, não decisão fechada.

regressions_check:
  status: PASS
  evidence: |
    turbo typecheck/lint/test 27/27 (9 workspaces × 3 tasks). core-data 82/82 (56 pré-existentes +
    26 novos) e config 3/3 executados diretamente por mim. Nenhuma tela alterada visualmente —
    religamento é troca de import/origem de dado, JSX intacto. Nenhum projeto/migration Supabase criado.

security_check:
  status: PASS
  evidence: >-
    Story 100% in-memory local — sem rede/backend/segredos. auth.port NÃO introduziu email/senha
    (grep confirma apenas comentários referenciando a pendência 10.4). Nenhum valor de regra
    hard-coded fora de @keepit/config (percentuais migrados p/ businessConfig; refund-helpers deriva
    de config). pin_hash segue não-exposto (herdado da Story 0.2). OWASP básico N/A.

contract_fidelity:
  status: PASS
  evidence: |
    Ponto mais crítico: fundação de 11 telas + swap Supabase (Story 1.6). Conferido enum a enum
    contra 03-data-models.md — divergência ZERO: pedidos.status 15/15, reembolsos.motivo 9/9,
    estabelecimentos_falhas.tipo 4/4 (lojista_nao_apareceu/atraso_grave/chargeback/reclamacao_admin),
    produtos.excluido_em (soft delete #3.1). Campos de coluna real em snake_case; camelCase apenas
    em read-models derivados de agregação (analytics/financialDashboard), que não são colunas.
    AsyncCallOptions unificado (eliminou LojistaAsyncOptions paralelo dos adaptadores locais).

notes: |
  Reconciliação executada com fidelidade ao spec do docs/EPICO_0_RECONCILIACAO.md e honestidade
  incomum: cada [AUTO-DECISION] (advanceStatus genérico, listAllEstabelecimentos, analytics.port
  CREATE, cart local) veio justificada com REUSE>ADAPT>CREATE, e os gaps deixados de fora foram
  explicitamente nomeados em vez de escondidos. A verificação independente de contrato — o risco
  central que o épico sinaliza como caro de corrigir depois — passou 1:1 em todos os enums.

  Verdict CONCERNS (não PASS) para RASTREAR 5 débitos LOW que uma fundação reusada por 11 telas +
  Supabase merece ter visíveis, nenhum tocando um AC nem bloqueando avanço: DOC-001 (CodeRabbit
  deferido), PERF-001 (campos de apresentação estáticos), MNT-001 (reembolsos seedado), MNT-002
  (4 TECH DEBT residuais fora-de-escopo), REL-001 (2 % de reembolso default inline sem stakeholder).
  Consistente com os gates CONCERNS das stories-origem (0.7/0.9/0.10/0.11/0.13). Story vai para Done
  com follow-ups registrados; o gap 10.4 permanece pendência explícita do stakeholder.

