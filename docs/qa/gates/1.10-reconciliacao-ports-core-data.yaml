schema: 1
story: "1.10"
storyId: "1.10"
storyName: "Reconciliação — promover adaptadores locais para as ports de packages/core-data"
gate: CONCERNS
verdict: CONCERNS
status_reason: >-
  Reconciliação sólida e honesta: os 8 adaptadores/contexts locais dos 3 apps foram
  promovidos para as ports de packages/core-data e removidos (zero *.mock.ts local
  restante), as ports estendidas espelham 1:1 os enums do schema (pedidos.status 15/15,
  reembolsos.motivo 9/9, estabelecimentos_falhas.tipo 4/4, produtos.excluido_em),
  o contrato assíncrono foi preservado (simulateAsync real + OrderTransitionError +
  AsyncCallOptions unificado), refundQueue passou a ser populada organicamente por
  todos os caminhos de cancelamento via helper central, os 6 percentuais migraram
  para businessConfig, e o gap 10.4 (auth email/senha) segue intocado. typecheck/lint/
  test 27/27, core-data 82/82 + config 3/3 verdes, verificados por mim. CONCERNS apenas
  por débitos LOW não-bloqueantes (CodeRabbit deferido, campos de apresentação estáticos
  sem port, db.reembolsos seedado, 2 % de reembolso default inline, TECH DEBT residual
  fora-de-escopo). Nenhum AC ficou em aberto.
reviewer: Quinn
reviewedBy: "@qa (Quinn)"
reviewedAt: "2026-07-29"
updated: "2026-07-29T00:00:00Z"
model: opus (claude-opus-4-8)

verification_method: >-
  Verificação INDEPENDENTE (não confiando no relato do @dev): `find apps -iname "*.mock.ts"`
  (vazio) + grep dos mocks/contexts nominais removidos; leitura direta das 6 ports promovidas
  (order/auth/admin/product/store) + analytics.port novo vs. docs/architecture/03-data-models.md
  campo a campo e enum a enum; grep dos enums no schema (estabelecimentos_falhas.tipo,
  reembolsos.motivo, excluido_em); leitura de refund-helpers.ts, cancelamentoPolicy.ts e
  businessConfig confirmando derivação de config (sem hard-code); grep confirmando ausência
  de email/senha em auth.port/auth.mock e pendência 10.4 ainda 🔴; execução própria de
  `pnpm turbo run typecheck lint test` (27/27), `@keepit/core-data test` (82/82) e
  `@keepit/config test` (3/3); inspeção do religamento dos apps (OrdersContext/FinanceiroContext
  consomem getDataClient(), não fixtures).

acceptance_criteria:
  - id: AC1
    description: "OrderPort lado lojista (listByEstabelecimento/markReadyForHub/markArrivedAtHub/markCustomerNoShow) + OrdersContext religado + lojistaOrders.mock.ts removido"
    status: PASS
    evidence: |
      4 métodos presentes em order.port.ts com transições documentadas (aceito/em_preparo→
      saindo_hub; saindo_hub→no_hub+lojista_chegou_em; no_hub→nao_retirado+motivo). order.mock
      usa OrderTransitionError promovido de lojistaOrders.mock.ts (Story 0.10). OrdersContext.tsx
      consome getDataClient().order (verificado grep — createLojistaOrdersMock ausente).
      lojistaOrders.mock.ts removido (find vazio). markCustomerNoShow chama registrarReembolso.
  - id: AC2
    description: "OrderPort lado cliente (getById + advance dos 3 estados + cliente_chegou_em) + OrderStatusOverrideContext removido"
    status: PASS
    evidence: |
      getById + advanceStatus(nextStatus: AdvanceableStatus) [AUTO-DECISION genérico p/ o
      dev-advancer, justificado no header] + markClienteChegou (exige no_hub). AdvanceableStatus
      = Extract<em_preparo|saindo_hub|no_hub>. OrderStatusOverrideContext.tsx removido (grep vazio
      em apps/cliente). Consumidores (OrderStatusDevAdvancer/ModalConfirmarPin/ChegueiAoHub) religados.
  - id: AC3
    description: "AuthPort.getById + updateCpf; sem email/senha; gap 10.4 preservado"
    status: PASS
    evidence: |
      getById + updateCpf presentes; Cliente modela apenas nome+telefone+cpf (grep de
      email/senha/password em auth.port/auth.mock retorna só comentários referenciando a
      pendência). docs/PERGUNTAS_REGRAS_NEGOCIO.md 10.4 segue 🔴 (linha 322). CLIENTE_NOME_POR_ID
      removido com lojistaOrders.mock.ts; nome do cliente agora via client.auth.getById.
  - id: AC4
    description: "AdminPort admin-ops (8 métodos) + refundQueue populada organicamente + 4 arquivos adminOps* removidos"
    status: PASS
    evidence: |
      listClientes/blockCliente/unblockCliente/suspendLojista/financialDashboard/
      lojistaQualityView/listAllOrders/forceCancelOrder + listAllEstabelecimentos [AUTO-DECISION
      justificado]. EstabelecimentoFalha/FinancialDashboardResult/FinancialRankingEntry promovidos;
      MockDb ganhou falhas. registrarReembolso (refund-helpers.ts) centraliza a criação e é
      reutilizado por order.refuse/cancel/markCustomerNoShow + admin.forceCancelOrder, cada um com
      ReembolsoMotivo correto (enum 9/9 confere com schema). 4 arquivos apps/admin/src/mock/* removidos.
  - id: AC5
    description: "ProductPort.delete (soft delete excluido_em) + ativo no update + list incluirInativos"
    status: PASS
    evidence: |
      excluido_em adicionado a Produto (schema #3.1 confirma soft delete). delete() nunca remove
      linha; UpdateProdutoInput ganhou ativo?; list(..., { incluirInativos }) filtra ativo/excluido_em
      por padrão. ProductCatalogContext.tsx religado (toggleAtivo/deleteProduto refletem retorno real).
  - id: AC6
    description: "StorePort.setPausadoManualmente + LojaDisponibilidadeContext persiste"
    status: PASS
    evidence: |
      setPausadoManualmente(estabelecimentoId, pausado) presente em store.port; pausado_manualmente
      persiste no db.estabelecimentos (sobrevive a getById). Comentário TECH DEBT local-only removido.
  - id: AC7
    description: "Analytics do lojista promovido — decisão REUSE/ADAPT/CREATE documentada"
    status: PASS
    evidence: |
      [AUTO-DECISION CREATE] analytics.port.ts novo com justificativa REUSE>ADAPT>CREATE completa
      no header (WalletPort = dinheiro liquidado/saque; analytics = read-model de agregação sobre
      pedidos/pedidos_itens — fronteiras distintas). salesSummary/topProducts/monthlyStatement
      derivam de total_pago_reais/nome_snapshot reais. financeiro.mock.ts removido; fixtures de
      pedidos estendidas (20/45/75/200/330 dias) p/ períodos 30d/90d/1a. Crescimento 7→8 ports
      aceito como custo de reconciliar gap real, não conveniência. Ver PERF-001 (campos estáticos).
  - id: AC8
    description: "Carrinho/cartão — decisão explícita local-only vs cart.port"
    status: PASS
    evidence: |
      [AUTO-DECISION FINAL: manter local] registrado em CartContext.tsx (linha 81, [IDS] Decisão
      FINAL): carrinho é rascunho client-side efêmero, sem sync entre dispositivos no MVP; cart.port
      avaliado e rejeitado. Comentário de pendência substituído por decisão definitiva. Ver MNT-002
      (TECH DEBT residual do cartão mock).
  - id: AC9
    description: "businessConfig ganha os 6 percentuais; cancelamentoPolicy deriva de config"
    status: PASS
    evidence: |
      6 chaves presentes em packages/config/src/index.ts (cancelamentoAntesAceitePercent:100,
      AposAceiteCliente:90/Lojista:10, clienteNaoApareceuCliente:20/Lojista:80, lojistaNaoVeio:100)
      — batem com a matriz da Rodada 2. cancelamentoPolicy.ts reexporta de businessConfig (sem
      hard-code); cancelamentoFaseFromStatus permanece local (lógica de UI). Teste novo em config valida.
  - id: AC10
    description: "Sem mudança visual + typecheck/lint/test verdes + grep zero mock/TECH DEBT dos gaps"
    status: CONCERNS
    evidence: |
      turbo typecheck/lint/test 27/27; core-data 82/82 + config 3/3 (executados por mim). Religamento
      é troca de origem do dado (imports getDataClient), não alteração de JSX — confirmado por
      inspeção. find apps -iname *.mock.ts VAZIO. Ressalva: 4 comentários [TECH DEBT] permanecem em
      apps/* (CartContext cartão mock, LojistaNaoVeio order.cancel motivo, WalletPort PIX/agregação
      mensal) — todos FORA do mapeamento de gaps desta story e documentados no Completion Notes; o
      do cartão mock é adjacente ao escopo do AC8. Não-bloqueante (ver MNT-002).

