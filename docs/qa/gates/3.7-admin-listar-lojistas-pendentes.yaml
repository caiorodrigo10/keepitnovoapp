resolved_issues:
  - id: 'SEC-001'
    was_severity: high
    category: security
    resolution: >-
      Migration 20260812140000_fachadas_admin_le.sql adiciona policy de SELECT
      `fachadas_admin_le` (FOR SELECT TO authenticated USING bucket_id='fachadas'
      AND public.is_admin()) em storage.objects. Admin passa a gerar URL assinada
      de fachada de qualquer lojista. Reforçado por REL-001 (mesmo em falha de
      assinatura, degrada para null sem crash). AC3 agora entregável no modo real.
  - id: 'REL-001'
    was_severity: medium
    category: reliability
    resolution: >-
      pendingStoreDetail encapsula createSignedUrl em try/catch — erro do SDK OU
      exceção → foto_fachada_url_assinada = null, restante do detalhe (CNPJ,
      responsável, PIX, horários, dados_receita) intacto. Erros da query principal
      continuam propagando. 3 testes (2 de degradação + 1 de propagação),
      admin.supabase.test.ts 11/11.

