# RE-GATE (correção do FAIL anterior) — evidência empírica:
# - SEC-001 (era high) RESOLVIDO: migration 20260812140000_fachadas_admin_le.sql
#   presente e correta (FOR SELECT TO authenticated, is_admin()). Satisfaz o
#   `TODO STORY 3.7` da migration 20260812123049. Como policies permissivas de
#   SELECT são OR-ed no Postgres, o admin passa a ler qualquer objeto do bucket
#   `fachadas` sem afrouxar a policy do dono (fachadas_lojista_le_propria intacta).
#   Limitação de ambiente: sem endpoint de pg_policies / sem SUPABASE_ACCESS_TOKEN
#   aqui — aplicação ao keepit-dev confirmada por arquivo de migration + registro
#   do orquestrador (mesma classe de débito de verificação manual de stories
#   anteriores). Rede de segurança: com REL-001, mesmo policy mal-aplicada degrada
#   AC3 para null honestamente, sem crash.
# - REL-001 (era medium) RESOLVIDO: pendingStoreDetail encapsula createSignedUrl
#   em try/catch; erro do SDK ({error}) OU exceção lançada → foto_fachada_url_assinada
#   = null com o restante do detalhe intacto; erro da query principal continua
#   propagando. Coberto por 2 testes novos + 1 de propagação.
# - Sem regressão: core-data 198/198 (admin.supabase.test.ts 11/11, era 9),
#   pnpm qa 27/27, admin typecheck limpo. auth-gate (AC6/AC7), pendingStores
#   (AC2/AC4), RLS admin_gerencia_estab e paridade mock intocados nesta correção.

top_issues:
  - id: 'BUILD-001'
    severity: medium # rebaixado de high pela correção parcial abaixo (@architect, 2026-08-12)
    category: reliability
    finding: >-
      `next build` com DATA_SOURCE=supabase no ambiente falha (TypeError null
      useState em /hubs/novo e /_global-error), reproduzido em Turbopack E webpack,
      isolado como dead-code-elimination do bundler no padrão
      `process.env.DATA_SOURCE === 'supabase'` de resolveDataSource. Build default
      (mock) é limpo. Bloqueia o build de PRODUÇÃO em modo real. NÃO é bug de
      lógica desta Story nem driver de FAIL — a lógica do adapter está correta e
      o build no modo padrão passa.
    architect_resolution: >-
      @architect (Aria), 2026-08-12 — DIAGNÓSTICO CONFIRMADO e CORREÇÃO PARCIAL
      APLICADA. Causa-raiz real: os hooks do Admin (useAdminHubs/useAdminPendingStores)
      chamam getDataClient() no corpo do render; em DATA_SOURCE=supabase isso
      instancia o grafo @supabase/supabase-js (gotrue/postgrest/realtime) durante
      o static prerender, e o Next.js 16.x (16.2.12 E 16.3.0, Turbopack E webpack)
      corrompe o singleton react-ssr do worker de static-generation (null
      dispatcher). FIX aplicado: `export const dynamic = 'force-dynamic'` no root
      layout (apps/admin/app/layout.tsx) — propaga a todas as rotas, remove as 12
      rotas reais do static prerender (contagem de páginas estáticas caiu de 13
      para 1). Trade-off aceito: Admin perde static export e passa a SSR-on-demand
      — correto para ferramenta interna auth-gated (intrinsecamente dinâmica), sem
      perda funcional. RESTA APENAS /_global-error — arquivo especial do Next 16 que
      NÃO herda segment config e é sempre prerenderizado; o grafo supabase avaliado
      no worker o corrompe (useContext null). É bug de framework UPSTREAM sem
      workaround de app/config (vercel/next.js #84994, #85668, #86178; testados e
      reprovados: force-dynamic, serverExternalPackages, output:standalone,
      experimental.dynamicIO, global-error custom, mover provider p/ fora do root
      layout, bump 16.3.0). Única correção de código restante = Opção 1 (dynamic
      import dos adapters em packages/core-data, tornando getDataClient() async) —
      BREAKING nas 3 apps, requer checkpoint; NÃO aplicada nesta rodada por decisão
      de escopo.
    suggested_action: >-
      Deploy do Admin em modo supabase: usar `next dev` (dev server, sem prerender
      — funciona) para o piloto interno, OU aplicar a Opção 1 (getDataClient async
      + dynamic import dos adapters supabase em core-data, coordenado com @dev nas 3
      apps) em rodada dedicada com checkpoint, OU aguardar fix upstream do Next 16
      para o prerender de /_global-error. force-dynamic já está commitável e é
      pré-requisito de qualquer um dos caminhos.
