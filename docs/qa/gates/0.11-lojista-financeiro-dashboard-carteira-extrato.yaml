top_issues:
  - id: 'ARCH-001'
    severity: medium
    finding: 'AC6 parcial: vendas por período, Top produtos e extrato mensal vêm de fixture local (financeiro.mock.ts) em vez do wallet.port — o port não expõe agregação/extrato (derivaria de pedidos/pedidos_itens).'
    suggested_action: 'Consolidar no débito de reconciliação de ports do Épico 0: avaliar promover para métodos reais de WalletPort ou nova analytics.port.ts em core-data (@architect/@data-engineer), agregando a partir de pedidos reais.'
  - id: 'REL-001'
    severity: medium
    finding: 'Dependência @keepit/config resolvida por symlink manual em apps/lojista/node_modules sem `pnpm install` — frágil, quebra em clone limpo / CI.'
    suggested_action: 'Rodar `pnpm install` na próxima janela com ambiente completo para materializar o workspace link (débito recorrente das stories lojista).'
  - id: 'TEST-001'
    severity: low
    finding: 'financeiro.mock.ts (fixtures de vendas/extrato) sem testes unitários; nenhum teste de UI (consistente com padrão do Épico 0).'
    suggested_action: 'Cobrir com testes quando os dados migrarem para o port real (parte de ARCH-001).'
  - id: 'DOC-001'
    severity: low
    finding: 'SimpleBarChart não renderiza os rótulos de eixo (S/T/Q/Q/S/S/D) visíveis no protótipo P1.'
    suggested_action: 'Adicionar rótulos opcionais ao componente numa iteração visual futura — não bloqueante para o Épico 0.'
  - id: 'REQ-002'
    severity: low
    finding: 'Validação visual em simulador/emulador deferida — sem ambiente nesta execução.'
    suggested_action: 'Rodar QA visual em dispositivo/simulador antes do fechamento do Épico 0 / início do Épico 1.'

