schema: 1
story: '0.9'
story_title: 'Lojista: Catálogo & Disponibilidade'
gate: CONCERNS
status_reason: >-
  Casca visual completa, fiel ao protótipo (P7/P9) e com tokens dark limpos; typecheck do
  lojista passa. Os writes de reativar/excluir produto e do toggle de disponibilidade da loja
  são session-local por gaps reais de ProductPort/StorePort em core-data — aceitável para o
  Épico 0, mas precisa de follow-up ARCH antes do Épico 1.
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-28T00:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'ARCH-001'
    severity: medium
    finding: >-
      ProductPort (packages/core-data) não tem delete(), o UpdateProdutoInput não aceita `ativo`
      (não há reativar) e list() filtra `ativo === true` incondicionalmente. Só create/update de
      campos e pause() persistem no mock db. Reativar produto, excluir produto e a listagem de
      produtos pausados são local-only no ProductCatalogContext — o provider ficaria inconsistente
      se remontado (ex.: hot-reload) após uma pausa.
    suggested_action: >-
      Estender ProductPort em packages/core-data (add delete()/excluido_em, permitir `ativo` no
      update ou reactivate(), e um list() que inclua inativos) numa story de reconciliação ARCH
      antes do Épico 1 (troca mock→Supabase). Delegar a @architect/@data-engineer.
  - id: 'ARCH-002'
    severity: medium
    finding: >-
      StorePort só expõe leitura (listByHub, getCatalog, getById, getState) — não há método de
      escrita para persistir estabelecimentos.pausado_manualmente. O toggle "Recebendo pedidos"
      (Task 6) está no domínio correto (store, não product) mas é session-local; não sobrevive a
      remount nem é lido de volta por store.port.
    suggested_action: >-
      Adicionar método de escrita em store.port.ts / store.mock.ts (ex.: setPausadoManualmente)
      na mesma story de reconciliação ARCH. Delegar a @architect/@data-engineer.
  - id: 'MNT-001'
    severity: low
    finding: >-
      ProductCatalogContext e LojaDisponibilidadeContext vivem em apps/lojista, não em
      @keepit/core-data/hooks (onde useHubs/useOrders/useStores/useWallet vivem por decisão da
      0.2) — consequência da restrição de escopo desta execução (só apps/lojista/**).
    suggested_action: >-
      Mover ambos os contexts para @keepit/core-data/hooks na story de reconciliação, para manter
      a troca mock→Supabase transparente às telas como as demais ports.
  - id: 'TEST-001'
    severity: low
    finding: >-
      Nenhum teste unitário adicionado para os helpers puros desta story (agruparHorarios,
      estoqueDisplayFromId) nem para a lógica dos contexts, embora agruparHorarios/estoque sejam
      facilmente testáveis. Consistente com o precedente de validação manual das 0.1/0.8 (monorepo
      sem framework de teste de UI; scripts de lint são `echo`).
    suggested_action: >-
      Adicionar testes unitários dos helpers puros quando um harness de teste (Jest/Vitest) for
      configurado no app lojista, ou em packages/core-data ao mover a lógica para lá (MNT-001).
  - id: 'REQ-002'
    severity: low
    finding: >-
      Validação visual em simulador iOS / emulador Android deferida — ambiente sem simulador.
      Fidelidade conferida por comparação estática do código contra as referências
      lojista-07-catalogo.png e lojista-09-horarios.png (cores/textos/tokens revisados).
    suggested_action: >-
      Rodar a validação visual em simulador/emulador antes de considerar a trilha lojista pronta
      para produção (débito recorrente do Épico 0, mesmo padrão de 0.1/0.4/0.8).

